name: Build and Publish Plugins (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for release creation and gh-pages push

    env:
      CI: true
      PLUGINS_RELEASE_TAG: latest-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permissions
        run: chmod +x gradlew

      - name: Build JARs
        run: ./gradlew -PmicrobotClientVersion=2.6.151 clean build -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }}

      - name: Generate plugin documentation
        run: ./gradlew -PmicrobotClientVersion=2.6.151 copyPluginDocs -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }}

      - name: Generate plugins.json
        run: ./gradlew -PmicrobotClientVersion=2.6.151 generatePluginsJson -PpluginsReleaseTag=${{ env.PLUGINS_RELEASE_TAG }}

      # Jars are NO LONGER published here (10-13 script-safeguard): plugin
      # builds produce the jars the manifest hashes, but the artifacts land in
      # the private techbot-jars repo via the techbot-plugins workflow. TechBot
      # entries carry a downloadUrl served through the license server instead.
      #
      # The hub itself detects ZERO plugins since Phase A parked the upstream
      # dirs, so refreshing the root catalog from this repo would overwrite it
      # with [] and race-wipe the entries that chefstevens/techbot-plugins CI
      # merges in (that happened 10-13, c1be979 vs 4fbd770). The ONLY writer
      # of the root plugins.json from now on is the techbot-plugins workflow.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          allow_empty_commit: true
